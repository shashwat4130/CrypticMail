version: "1.0.0"
standards_baseline:
  - "NIST SP 800-52 Rev. 2 (Under Review)"
  - "RFC 8446"
  - "RFC 8996"
  - "RFC 3207"
  - "RFC 8314"
  - "RFC 2595"
  - "RFC 5280"

rules:
  - id: "RULE-TLS-001"
    category: "TLS_VERSION"
    title: "Obsolete SSL Protocol Version (SSL 2.0 / SSL 3.0)"
    severity: "CRITICAL"
    standard: "RFC 6176 / RFC 7568"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-TLS-002"
    category: "TLS_VERSION"
    title: "Deprecated TLS Protocol Version (TLS 1.0 / TLS 1.1)"
    severity: "HIGH"
    standard: "RFC 8996"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-TLS-003"
    category: "TLS_VERSION"
    title: "TLS 1.2 Protocol Negotiated"
    severity: "INFO"
    standard: "RFC 5246"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-TLS-004"
    category: "TLS_VERSION"
    title: "Modern TLS 1.3 Protocol Negotiated"
    severity: "INFO"
    standard: "RFC 8446"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-CIPHER-001"
    category: "CIPHER_SUITE"
    title: "Insecure NULL Encryption Cipher Suite"
    severity: "CRITICAL"
    standard: "RFC 5246"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-CIPHER-002"
    category: "CIPHER_SUITE"
    title: "Broken RC4 Stream Cipher Negotiated"
    severity: "CRITICAL"
    standard: "RFC 7465"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-CIPHER-003"
    category: "CIPHER_SUITE"
    title: "Vulnerable 64-bit Block Cipher (3DES / Triple-DES)"
    severity: "HIGH"
    standard: "RFC 8996 / CVE-2016-2183"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-CIPHER-004"
    category: "CIPHER_SUITE"
    title: "CBC-Mode Cipher Suite in TLS 1.2"
    severity: "MEDIUM"
    standard: "NIST SP 800-52r2"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-KEX-001"
    category: "KEY_EXCHANGE"
    title: "Static RSA Key Exchange (Missing Forward Secrecy)"
    severity: "HIGH"
    standard: "NIST SP 800-52r2"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-KEX-002"
    category: "KEY_EXCHANGE"
    title: "Weak Diffie-Hellman Modulus (< 2048 bits)"
    severity: "HIGH"
    standard: "NIST SP 800-52r2 / RFC 7919"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-KEX-003"
    category: "KEY_EXCHANGE"
    title: "Deprecated or Weak Named Curve"
    severity: "MEDIUM"
    standard: "NIST SP 800-52r2"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-CERT-001"
    category: "CERTIFICATE_VALIDITY"
    title: "Expired X.509 Server Certificate"
    severity: "HIGH"
    standard: "RFC 5280"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-CERT-002"
    category: "CERTIFICATE_VALIDITY"
    title: "Certificate Not Yet Valid"
    severity: "MEDIUM"
    standard: "RFC 5280"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-CERT-003"
    category: "CERTIFICATE_VALIDITY"
    title: "Insufficient RSA Public Key Length (< 2048 bits)"
    severity: "CRITICAL"
    standard: "NIST SP 800-52r2"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-CERT-004"
    category: "CERTIFICATE_VALIDITY"
    title: "Weak Signature Algorithm in Certificate (MD5 / SHA-1)"
    severity: "CRITICAL"
    standard: "RFC 5280 / NIST SP 800-52r2"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-PKI-001"
    category: "CERTIFICATE_CHAIN"
    title: "Self-Signed Server Certificate"
    severity: "MEDIUM"
    standard: "RFC 5280"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-PKI-002"
    category: "CERTIFICATE_CHAIN"
    title: "Certificate Chain Path Validation Failed"
    severity: "HIGH"
    standard: "RFC 5280"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-STARTTLS-001"
    category: "STARTTLS_SECURITY"
    title: "Unencrypted Mail Session (No TLS / No STARTTLS)"
    severity: "CRITICAL"
    standard: "RFC 8314"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-STARTTLS-002"
    category: "STARTTLS_SECURITY"
    title: "Suspected STARTTLS Stripping / Downgrade"
    severity: "HIGH"
    standard: "RFC 3207 / RFC 8314"
    confidence: "SUSPECTED"

  - id: "RULE-EMAIL-001"
    category: "PROTOCOL_FLOW"
    title: "Insecure Cleartext Email Access Port Observed"
    severity: "HIGH"
    standard: "RFC 8314"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-IDENTITY-001"
    category: "IDENTITY_ALIGNMENT"
    title: "Certificate Identity (SAN) Does Not Match Observed TLS SNI"
    severity: "MEDIUM"
    standard: "RFC 6066 / RFC 5280"
    confidence: "CONFIRMED_OBSERVED"

  - id: "RULE-ANOMALY-001"
    category: "PROTOCOL_FLOW"
    title: "Inconsistent TLS Record and Handshake Version"
    severity: "LOW"
    standard: "RFC 8446"
    confidence: "SUSPECTED"